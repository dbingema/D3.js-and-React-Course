<!doctype html>
<html>
  <head>
    <title>My First Website</title>
  </head>

  <body>
    <h1>Hello World!</h1>
    <p>This is my very first website.</p>
	<p>A new paragraph...</p>
	<a href="https://github.com/dbingema/D3.js-and-React-Course">Link to Code</a>
	
		
	<!-- Load D3.js from CDN -->
	<script src="https://d3js.org/d3.v7.min.js"></script>

	<script>
	  // Data
	  const data = [
		{ name: "A", value: 1 },
		{ name: "B", value: 5 },
		{ name: "C", value: 8 },
		{ name: "D", value: 10 }
	  ];

	  // Define chart dimensions
	  const width = 500;
	  const height = 300;
	  const margin = 40;

	  // Create SVG element
	  const svg = d3.select("body")
		.append("svg")
		.attr("width", width)
		.attr("height", height);

	  // Define scale for bar heights
	  const yScale = d3.scaleLinear()
		.domain([0, d3.max(data, d => d.value)])
		.range([height - margin, margin]);

	  // Define scale for bar positions
	  const xScale = d3.scaleBand()
		.domain(data.map(d => d.name))
		.range([margin, width - margin])
		.padding(0.2);

	  // Create bars
	  svg.selectAll("rect")
		.data(data)
		.enter()
		.append("rect")
		.attr("x", d => xScale(d.name))
		.attr("y", d => yScale(d.value))
		.attr("width", xScale.bandwidth())
		.attr("height", d => height - margin - yScale(d.value))
		.attr("fill", "steelblue");

	  // Add labels below the bars
	  svg.selectAll("text")
		.data(data)
		.enter()
		.append("text")
		.text(d => d.name)
		.attr("x", d => xScale(d.name) + xScale.bandwidth() / 2)
		.attr("y", height - margin + 20)
		.attr("text-anchor", "middle")
		.attr("font-size", "14px");
	</script>


  </body>
</html>
